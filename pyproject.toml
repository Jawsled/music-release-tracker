[project]
name = "music-release-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kurosiko", email = "kurosiko@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "httpx>=0.28.1",
